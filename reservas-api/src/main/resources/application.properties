spring.application.name=reservas-api

reservas.zona-horaria=America/Santiago

# ── Base de datos (SQLite) ──────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:reservas.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite admite un solo escritor a la vez.
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# El esquema lo crea schema.sql (reservas-infrastructure/src/main/resources), no Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# ── Swagger ─────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
